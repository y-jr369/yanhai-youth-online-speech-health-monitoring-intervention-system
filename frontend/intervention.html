<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>干预跟进 - 言海瞭望</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20260501-long-diagonal-lines">
  <style>
    .metric-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 22px 0;
    }
    .metric {
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .metric::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 92% 10%, rgba(244, 162, 97, 0.22), transparent 35%);
      pointer-events: none;
    }
    .metric .value {
      font-size: 28px;
      line-height: 1.1;
    }
    .metric .label {
      margin-top: 6px;
      color: #667085;
      font-size: 13px;
    }
    .queue-layout {
      display: grid;
      grid-template-columns: minmax(360px, 0.95fr) minmax(0, 1.65fr);
      gap: 20px;
      align-items: stretch;
    }
    .queue-layout > .card-box {
      height: 100%;
    }
    .risk-list {
      display: grid;
      gap: 12px;
      max-height: calc(100vh - 274px);
      overflow: auto;
      padding-right: 3px;
    }
    .risk-card {
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(143, 165, 184, 0.22);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.68)),
        radial-gradient(circle at 100% 0%, rgba(217, 92, 92, 0.10), transparent 34%);
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .risk-card:hover,
    .risk-card.active {
      border-color: rgba(50, 183, 198, 0.55);
      box-shadow: 0 14px 34px rgba(50, 183, 198, 0.13);
      transform: translateY(-1px);
    }
    .risk-card-title {
      color: #122033;
      font-weight: 800;
      font-size: 17px;
      margin: 10px 0 8px;
    }
    .risk-card-summary {
      color: #667085;
      font-size: 14px;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .risk-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: #667085;
      font-size: 12px;
      margin-top: 10px;
    }
    .badge-soft {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      background: #eef9f7;
      color: #126372;
    }
    .workbench-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) 240px;
      gap: 16px;
      align-items: start;
    }
    .info-panel {
      padding: 16px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.80), rgba(255, 255, 255, 0.60)),
        radial-gradient(circle at 0% 0%, rgba(50, 183, 198, 0.12), transparent 30%);
      box-shadow: none;
    }
    .risk-viz {
      display: grid;
      gap: 12px;
    }
    .score-ring {
      width: 132px;
      height: 132px;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(#d95c5c var(--score, 72%), rgba(217, 92, 92, 0.12) 0);
      position: relative;
    }
    .score-ring::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
    }
    .score-ring span {
      position: relative;
      z-index: 1;
      color: #122033;
      font-size: 28px;
      font-weight: 900;
    }
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-cloud span {
      border-radius: 999px;
      padding: 6px 9px;
      color: #126372;
      background: rgba(50, 183, 198, 0.12);
      font-size: 12px;
      font-weight: 750;
    }
    .status-steps {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .status-step {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #667085;
      font-size: 13px;
    }
    .status-step i {
      color: #4fc79a;
    }
    .reply-box {
      min-height: 320px;
      resize: vertical;
      line-height: 1.75;
      font-size: 16px;
    }
    .status-line {
      min-height: 24px;
      margin-top: 12px;
      color: #667085;
      font-size: 13px;
    }
    .log-list {
      max-height: 190px;
      overflow: auto;
      color: #667085;
      font-size: 14px;
    }
    @media (max-width: 1180px) {
      .queue-layout,
      .workbench-grid {
        grid-template-columns: 1fr;
      }
      .risk-list {
        max-height: none;
      }
    }
    @media (max-width: 720px) {
      .metric-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="sidebar-mark"><i class="fa-solid fa-shield-halved"></i><span>言海瞭望</span></div>
      <nav class="app-nav">
        <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i>总览</a>
        <a href="posts.html"><i class="fa-solid fa-table-list"></i>帖子总览</a>
        <a href="alerts.html"><i class="fa-solid fa-bell"></i>预警中心</a>
        <a href="archive.html"><i class="fa-solid fa-box-archive"></i>归档中心</a>
        <a class="active" href="intervention.html"><i class="fa-solid fa-user-doctor"></i>干预跟进</a>
      </nav>
      <div class="sidebar-foot">AI辅助生成，人工审核把关，专业人员跟踪处理。</div>
    </aside>

    <main class="app-main">
      <header class="page-header">
        <div>
          <h1 class="page-title">心理干预闭环工作台</h1>
          <div class="page-subtitle">集中处理高风险帖子队列，查看原帖内容、风险依据与AI辅助建议，并记录人工审核、处理凭证和后续跟踪结果。</div>
        </div>
        <button class="btn btn-outline-primary" onclick="loadInterventions()">
          <i class="fa-solid fa-rotate me-1"></i>刷新风险队列
        </button>
      </header>

      <section class="metric-row">
        <div class="metric"><div id="metricTotal" class="value">0</div><div class="label">待处理高风险帖子</div></div>
        <div class="metric"><div id="metricDraft" class="value">0</div><div class="label">AI草稿待审核</div></div>
        <div class="metric"><div id="metricApproved" class="value">0</div><div class="label">已审核待跟进</div></div>
        <div class="metric"><div id="metricSent" class="value">0</div><div class="label">已完成处理记录</div></div>
      </section>

      <div class="queue-layout">
        <section class="card-box">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="card-inner-title"><i class="fa-solid fa-triangle-exclamation text-danger me-2"></i>高风险帖子队列</div>
            <span class="badge-soft"><i class="fa-solid fa-filter"></i>按风险优先</span>
          </div>
          <div id="riskList" class="risk-list"></div>
        </section>

        <section class="card-box">
          <div class="card-inner-title mb-3"><i class="fa-solid fa-clipboard-check text-primary me-2"></i>咨询师审核工作台</div>
          <div id="replyEmptyState" class="text-muted py-4">请选择左侧一条高风险帖子，查看风险依据并生成干预建议。</div>
          <div id="replyPanel" class="d-none">
            <div class="workbench-grid">
              <div>
                <div class="info-panel mb-3">
                  <div class="d-flex justify-content-between gap-3 flex-wrap">
                    <div>
                      <div class="fw-bold mb-1" id="replyPostTitle">-</div>
                      <div class="small text-muted" id="replyPostMeta">-</div>
                    </div>
                    <a id="replyPostUrl" class="btn btn-outline-primary btn-sm" href="#" target="_blank" rel="noopener noreferrer">
                      <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>打开原帖
                    </a>
                  </div>
                  <div class="mt-3" id="replyPostExcerpt">-</div>
                </div>

                <div class="info-panel mb-3">
                  <div class="fw-semibold mb-2">AI生成干预建议</div>
                  <label class="form-label small text-muted">AI辅助生成，需由专业人员审核后使用</label>
                  <textarea id="replyFinalContent" class="form-control reply-box" placeholder="点击生成干预建议，或手动输入需要保存的支持性处理建议"></textarea>
                  <div class="d-flex gap-2 flex-wrap mt-3">
                    <button id="generateReplyBtn" class="btn btn-primary" onclick="generateReplyDraft()">
                      <i class="fa-solid fa-wand-magic-sparkles me-1"></i>生成干预建议
                    </button>
                    <button class="btn btn-outline-secondary" onclick="copyReplyContent()">
                      <i class="fa-solid fa-copy me-1"></i>复制文案
                    </button>
                  </div>
                </div>

                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">审核人</label>
                    <input id="replyReviewer" class="form-control" value="管理员">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">处理凭证 / 备注链接</label>
                    <input id="externalReplyUrl" class="form-control" placeholder="可填写后续记录、截图或平台链接">
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold">审核备注</label>
                    <input id="replyReviewNote" class="form-control" placeholder="填写修改原因、审核意见或后续跟进说明">
                  </div>
                </div>

                <div class="form-check mt-3">
                  <input id="publicAllowed" class="form-check-input" type="checkbox" checked>
                  <label class="form-check-label" for="publicAllowed">已确认文案适合公开评论区发布</label>
                </div>

                <div class="d-flex gap-2 flex-wrap mt-3">
                  <button class="btn btn-success" onclick="reviewReply('approve')">保存审核意见</button>
                  <button class="btn btn-outline-warning" onclick="reviewReply('save_only')">保存草稿</button>
                  <button class="btn btn-outline-danger" onclick="reviewReply('reject')">驳回建议</button>
                  <button class="btn btn-outline-success ms-auto" onclick="markReplySent()">记录已处理</button>
                </div>
                <div id="replyStatus" class="status-line"></div>
              </div>

              <aside class="risk-viz">
                <div class="info-panel text-center">
                  <div class="small text-muted mb-2">风险分数</div>
                  <div id="scoreRing" class="score-ring"><span id="riskScoreValue">0</span></div>
                </div>
                <div class="info-panel">
                  <div class="fw-semibold mb-2">风险标签</div>
                  <div id="riskTagCloud" class="tag-cloud"></div>
                </div>
                <div class="info-panel">
                  <div class="fw-semibold mb-2">审核状态</div>
                  <div id="replyRiskInfo" class="small text-muted">-</div>
                  <div class="status-steps">
                    <div class="status-step"><i class="fa-solid fa-circle-check"></i>风险发现</div>
                    <div class="status-step"><i class="fa-solid fa-circle-check"></i>AI辅助生成</div>
                    <div class="status-step"><i class="fa-solid fa-user-check"></i>人工审核</div>
                    <div class="status-step"><i class="fa-solid fa-flag-checkered"></i>跟踪处理</div>
                  </div>
                </div>
              </aside>
            </div>

          </div>
        </section>
      </div>
    </main>
  </div>

  <footer class="site-icp">ICP备案号：吉ICP备2026003493号-1</footer>

  <script src="assets/js/api.js?v=20260501-align"></script>
  <script src="assets/js/intervention.js?v=20260501-beijing-time"></script>
</body>
</html>
