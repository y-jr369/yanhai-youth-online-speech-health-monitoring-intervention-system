<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统总览 - 言海瞭望</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20260501-long-diagonal-lines">
  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 100%);
      min-height: 100vh;
      color: #334155;
      font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .navbar {
      background: rgba(255, 255, 255, 0.7) !important;
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      padding: 14px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 19px;
      color: #2563eb !important;
      letter-spacing: 0.5px;
    }
    .nav-link {
      color: #64748b !important;
      font-weight: 500;
      transition: all 0.3s;
      padding: 8px 16px !important;
      border-radius: 10px;
      margin: 0 4px;
    }
    .nav-link:hover {
      color: #1e293b !important;
      background: rgba(59, 130, 246, 0.08);
    }
    .nav-link.active {
      color: #2563eb !important;
      background: rgba(59, 130, 246, 0.1);
      box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.2);
    }
    .page-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 28px;
      color: #0f172a;
      display: flex;
      align-items: center;
      letter-spacing: 1px;
    }
    .card-box {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 26px;
      margin-bottom: 24px;
      height: 100%;
      border: 1px solid #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }
    .stat-title {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }
    .stat-title i {
      margin-right: 10px;
      color: #3b82f6;
    }
    .stat-number {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.2;
    }
    .chart-box {
      width: 100%;
      height: 380px;
    }
    .summary-card {
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 18px;
      padding: 18px 20px;
    }
    .summary-card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }
    .summary-card-meta,
    .summary-note {
      color: #64748b;
      font-size: 13px;
      line-height: 1.7;
    }
    .mini-metric {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 16px;
      padding: 16px 18px;
      height: 100%;
    }
    .mini-metric-label {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .mini-metric-value {
      color: #0f172a;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="sidebar-mark"><i class="fa-solid fa-shield-halved"></i><span>言海瞭望</span></div>
      <nav class="app-nav">
        <a class="active" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i>总览</a>
        <a href="posts.html"><i class="fa-solid fa-table-list"></i>帖子总览</a>
        <a href="alerts.html"><i class="fa-solid fa-bell"></i>预警中心</a>
        <a href="archive.html"><i class="fa-solid fa-box-archive"></i>归档中心</a>
        <a href="intervention.html"><i class="fa-solid fa-user-doctor"></i>干预跟进</a>
      </nav>
      <div class="sidebar-foot">风险识别、人工审核与干预跟踪协同完成。</div>
    </aside>
    <main class="app-main">
    <div class="page-title">系统总览</div>

    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="card-box">
          <div class="stat-title"><i class="fa-solid fa-file-lines"></i>帖子总数</div>
          <div id="totalPosts" class="stat-number">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-box">
          <div class="stat-title"><i class="fa-solid fa-triangle-exclamation"></i>预警总数</div>
          <div id="totalAlerts" class="stat-number">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-box">
          <div class="stat-title"><i class="fa-solid fa-skull-crossbones"></i>高风险数</div>
          <div id="highRisk" class="stat-number">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-box">
          <div class="stat-title"><i class="fa-solid fa-clock"></i>待处理数</div>
          <div id="pending" class="stat-number">0</div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-lg-8">
        <div class="card-box">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
            <div>
              <div class="stat-title"><i class="fa-solid fa-rotate"></i>最新抓取任务</div>
              <div id="crawlJobTitle" class="summary-card-title">暂无抓取任务记录</div>
              <div id="crawlJobMeta" class="summary-card-meta mt-2">你可以点击右侧按钮手动更新抓取，系统会自动去重并保留已有帖子。</div>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span id="crawlJobStatus" class="badge rounded-pill text-bg-secondary">未执行</span>
              <button id="dashboardManualRefreshBtn" class="btn btn-primary">
                <i class="fa-solid fa-rotate me-1"></i>手动更新抓取
              </button>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-md-3 col-6">
              <div class="mini-metric">
                <div class="mini-metric-label">新增帖子</div>
                <div id="crawlInsertedValue" class="mini-metric-value">0</div>
              </div>
            </div>
            <div class="col-md-3 col-6">
              <div class="mini-metric">
                <div class="mini-metric-label">重复帖子</div>
                <div id="crawlDuplicatedValue" class="mini-metric-value">0</div>
              </div>
            </div>
            <div class="col-md-3 col-6">
              <div class="mini-metric">
                <div class="mini-metric-label">失败数量</div>
                <div id="crawlFailedValue" class="mini-metric-value">0</div>
              </div>
            </div>
            <div class="col-md-3 col-6">
              <div class="mini-metric">
                <div class="mini-metric-label">耗时</div>
                <div id="crawlDurationValue" class="mini-metric-value">暂无</div>
              </div>
            </div>
          </div>

          <div class="summary-card mt-3">
            <div class="mini-metric-label">任务摘要</div>
            <div id="crawlJobSummary" class="summary-note">最近一次抓取摘要将在这里显示。</div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card-box">
          <div class="stat-title"><i class="fa-solid fa-heart-pulse"></i>抓取健康度</div>
          <div class="row g-3">
            <div class="col-12">
              <div class="mini-metric">
                <div class="mini-metric-label">启用采集源</div>
                <div id="activeSourcesValue" class="mini-metric-value">0</div>
              </div>
            </div>
            <div class="col-12">
              <div class="mini-metric">
                <div class="mini-metric-label">近 24 小时任务</div>
                <div id="jobsLast24hValue" class="mini-metric-value">0</div>
              </div>
            </div>
          </div>
          <div id="crawlHealthNote" class="summary-note mt-3">抓取健康数据会随着任务执行自动刷新。</div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-12">
        <div class="card-box">
          <div id="riskChart" class="chart-box"></div>
        </div>
      </div>
    </div>
    </main>
  </div>

  <footer class="site-icp">ICP备案号：吉ICP备2026003493号-1</footer>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="assets/js/api.js?v=20260501-align"></script>
  <script src="assets/js/dashboard.js?v=20260501-beijing-time"></script>
</body>
</html>
