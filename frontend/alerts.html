<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预警中心 - 言海瞭望</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20260501-long-diagonal-lines">
  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 100%);
      min-height: 100vh;
      color: #334155;
      font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(rgba(59, 130, 246, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -2;
      pointer-events: none;
    }
    .float-light {
      position: fixed;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(45px);
      animation: float 15s infinite ease-in-out;
      z-index: -1;
    }
    .light-1 { width: 300px; height: 300px; top: -10%; left: -5%; }
    .light-2 { width: 250px; height: 250px; bottom: 10%; right: -5%; animation-delay: 5s; background: rgba(139, 92, 246, 0.1); }
    .light-3 { width: 200px; height: 200px; top: 40%; left: 60%; animation-delay: 8s; background: rgba(56, 189, 248, 0.1); }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-40px) scale(1.1); }
    }
    .navbar {
      background: rgba(255, 255, 255, 0.7) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      padding: 14px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 19px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .navbar-brand i { -webkit-text-fill-color: #3b82f6; }
    .nav-link {
      color: #64748b !important;
      font-weight: 500;
      transition: all 0.3s;
      padding: 8px 16px !important;
      border-radius: 10px;
      margin: 0 4px;
    }
    .nav-link:hover {
      color: #1e293b !important;
      background: rgba(59, 130, 246, 0.08);
    }
    .nav-link.active {
      color: #2563eb !important;
      background: rgba(59, 130, 246, 0.1);
      box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.2);
    }
    .page-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
      display: flex;
      align-items: center;
      letter-spacing: 1px;
    }
    .page-title::before {
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      content: '\f06a';
      margin-right: 14px;
      color: #3b82f6;
      font-size: 22px;
      text-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 28px;
    }
    .page-subtitle {
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
      max-width: 760px;
    }
    .page-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      min-width: 250px;
    }
    .export-status {
      min-height: 20px;
      color: #64748b;
      font-size: 13px;
      text-align: right;
    }
    .card-box {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 26px;
      margin-bottom: 24px;
      height: 100%;
      border: 1px solid #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card-box:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 0 20px rgba(59, 130, 246, 0.1);
      background: rgba(255, 255, 255, 0.85);
    }
    .card-inner-title {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }
    .card-inner-title i { margin-right: 10px; color: #3b82f6; }
    .table { color: #334155; margin-bottom: 0; font-size: 14px; }
    .table>:not(caption)>*>* {
      background-color: transparent;
      border-bottom-color: rgba(0, 0, 0, 0.05);
      padding: 16px 12px;
      vertical-align: middle;
    }
    .table thead th {
      color: #64748b;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.08) !important;
      white-space: nowrap;
    }
    .table-hover tbody tr:hover td {
      background-color: rgba(59, 130, 246, 0.04);
      color: #0f172a;
    }
    tbody td, tbody td * { color: #334155 !important; }
    .table-hover tbody tr:hover td, .table-hover tbody tr:hover td * { color: #0f172a !important; }
    @media (max-width: 991.98px) {
      .page-header {
        flex-direction: column;
        align-items: stretch;
      }
      .page-actions {
        align-items: stretch;
        min-width: 0;
      }
      .export-status {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="sidebar-mark"><i class="fa-solid fa-shield-halved"></i><span>言海瞭望</span></div>
      <nav class="app-nav">
        <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i>总览</a>
        <a href="posts.html"><i class="fa-solid fa-table-list"></i>帖子总览</a>
        <a class="active" href="alerts.html"><i class="fa-solid fa-bell"></i>预警中心</a>
        <a href="archive.html"><i class="fa-solid fa-box-archive"></i>归档中心</a>
        <a href="intervention.html"><i class="fa-solid fa-user-doctor"></i>干预跟进</a>
      </nav>
      <div class="sidebar-foot">风险识别、人工审核与干预跟踪协同完成。</div>
    </aside>
    <main class="app-main">
    <div class="page-header">
      <div>
        <div class="page-title">预警中心</div>
        <div class="page-subtitle">集中查看风险帖子，并可一键导出当前风险名单 Excel，方便留档、上报和线下处理。</div>
      </div>
      <div class="page-actions">
        <button id="exportAlertsBtn" class="btn btn-success btn-lg" onclick="exportAlertsExcel()">
          <i class="fa-solid fa-file-excel me-1"></i>导出 Excel 风险名单
        </button>
        <div id="exportAlertStatus" class="export-status">点击按钮即可下载当前风险名单 Excel。</div>
      </div>
    </div>

    <div class="card-box">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <div class="card-inner-title mb-0"><i class="fa-solid fa-triangle-exclamation"></i>实时预警监测列表</div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>预警ID</th>
              <th>帖子ID</th>
              <th>来源</th>
              <th>摘要片段</th>
              <th>标签</th>
              <th>风险等级</th>
              <th>风险分</th>
              <th>链接</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="alertTableBody"></tbody>
        </table>
      </div>
    </div>
    </main>
  </div>

  <footer class="site-icp">ICP备案号：吉ICP备2026003493号-1</footer>

  <script src="assets/js/common.js?v=20260501-align"></script>
  <script src="assets/js/alerts.js?v=20260501-align"></script>
</body>
</html>
