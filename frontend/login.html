<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统登录 - 言海瞭望</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20260501-long-diagonal-lines" />
  <style>
    body {
      overflow: hidden;
    }
    .login-shell {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) 440px;
      gap: 42px;
      align-items: center;
      padding: 56px clamp(28px, 6vw, 92px);
    }
    .hero-panel {
      position: relative;
      z-index: 1;
      max-width: 780px;
    }
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #126372;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(234, 251, 247, 0.82));
      border: 1px solid rgba(50, 183, 198, 0.22);
      font-size: 15px;
      font-weight: 750;
    }
    .hero-title {
      margin: 0;
      color: #122033;
      font-size: clamp(48px, 6vw, 82px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0;
    }
    .hero-copy {
      max-width: 680px;
      margin: 22px 0 28px;
      color: #4b5f73;
      font-size: 20px;
      line-height: 1.9;
    }
    .capability-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      max-width: 760px;
    }
    .capability {
      min-height: 126px;
      padding: 18px;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.62)),
        radial-gradient(circle at 90% 0%, rgba(244, 162, 97, 0.18), transparent 36%);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 42px rgba(50, 183, 198, 0.12), 0 10px 24px rgba(139, 124, 200, 0.08);
    }
    .capability i {
      color: #22aebd;
      font-size: 24px;
      margin-bottom: 14px;
    }
    .capability strong {
      display: block;
      color: #122033;
      font-size: 17px;
      margin-bottom: 8px;
    }
    .capability span {
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }
    .login-card {
      position: relative;
      z-index: 1;
      padding: 32px;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.90), rgba(255, 255, 255, 0.72)),
        radial-gradient(circle at 100% 0%, rgba(50, 183, 198, 0.18), transparent 38%);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 28px 76px rgba(50, 74, 105, 0.18), 0 16px 38px rgba(244, 162, 97, 0.12);
      backdrop-filter: blur(22px);
    }
    .login-card h2 {
      margin: 0 0 8px;
      color: #122033;
      font-size: 30px;
      font-weight: 850;
    }
    .login-card .muted {
      color: #667085;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .input-group {
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(143, 165, 184, 0.38);
    }
    .input-group:focus-within {
      border-color: rgba(50, 183, 198, 0.7);
      box-shadow: 0 0 0 4px rgba(50, 183, 198, 0.13);
    }
    .input-group-text,
    .form-control {
      border: 0;
      background: transparent !important;
    }
    .input-group-text {
      color: #6aa8b2;
      padding-left: 16px;
    }
    .form-control {
      padding: 16px 14px 16px 8px;
      font-size: 16px;
    }
    @media (max-width: 1080px) {
      body { overflow: auto; }
      .login-shell {
        grid-template-columns: 1fr;
      }
      .login-card {
        max-width: 480px;
      }
    }
    @media (max-width: 720px) {
      .login-shell {
        padding: 30px 16px;
      }
      .capability-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="hero-panel">
      <div class="hero-kicker"><i class="fa-solid fa-wand-magic-sparkles"></i>AI辅助心理健康服务平台</div>
      <h1 class="hero-title">言海瞭望</h1>
      <p class="hero-copy">面向校园网络言论场景，从风险识别、人工审核到干预跟踪，构建专业、可信、可落地的心理健康管理闭环。</p>
      <div class="capability-grid">
        <div class="capability">
          <i class="fa-solid fa-wave-square"></i>
          <strong>言论风险识别</strong>
          <span>聚合帖子线索、风险标签和模型评分，帮助老师快速定位需要关注的内容。</span>
        </div>
        <div class="capability">
          <i class="fa-solid fa-brain"></i>
          <strong>AI辅助建议</strong>
          <span>生成支持性干预草稿，保留人工审核把关，避免机械化替代专业工作。</span>
        </div>
        <div class="capability">
          <i class="fa-solid fa-route"></i>
          <strong>闭环跟踪管理</strong>
          <span>记录审核意见、处理凭证和跟进日志，让每一次预警都有清晰去向。</span>
        </div>
      </div>
    </section>

    <section class="login-card">
      <h2>进入工作台</h2>
      <div class="muted">请使用管理员账号登录，进入校园网络言论健康监测与干预系统。</div>
      <form id="loginForm" action="dashboard.html" method="get">
        <div class="mb-3">
          <label class="form-label fw-semibold">用户名</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input id="username" class="form-control" value="admin" placeholder="请输入管理员账号" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input id="password" type="password" class="form-control" value="123456" placeholder="请输入密码" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-3">
          <i class="fa-solid fa-right-to-bracket me-2"></i>安全登录
        </button>
      </form>
    </section>
  </main>

  <footer class="site-icp">ICP备案号：吉ICP备2026003493号-1</footer>

  <script src="assets/js/api.js?v=20260501-align"></script>
  <script src="assets/js/login.js?v=20260501-align"></script>
</body>
</html>
